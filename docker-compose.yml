version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: cascadeiq
      POSTGRES_USER: cascadeiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://cascadeiq:cascadeiq@db:5432/cascadeiq
      DATABASE_URL_SYNC: postgresql://cascadeiq:cascadeiq@db:5432/cascadeiq
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      AUTHORITY_USERNAME: ${AUTHORITY_USERNAME:-authority}
      AUTHORITY_PASSWORD: ${AUTHORITY_PASSWORD:?Set AUTHORITY_PASSWORD in .env}
    volumes:
      - ./data:/app/data
      - ./backend:/app
    env_file:
      - .env

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
